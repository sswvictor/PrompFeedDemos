name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repo-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block unresolved merge markers
        run: |
          if git grep -n -E "<<<<<<<|=======|>>>>>>>" -- '*.py' '*.ps1' '*.js' '*.jsx' '*.ts' '*.tsx' '*.md'; then
            echo "Merge markers detected. Resolve conflicts before merge."
            exit 1
          fi
      - name: Ensure required dev scripts exist
        run: |
          test -f scripts/dev-up.ps1
          test -f scripts/dev-down.ps1
          test -f scripts/run-ai-booking-e2e.ps1
          test -f backend/scripts/seed_demo_providers.py

  backend-check:
    runs-on: ubuntu-latest
    needs: repo-guardrails
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ci_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall app
      - name: DB bootstrap smoke test (fresh DB)
        run: python -m app.db.bootstrap
      - name: Assert schema revision is at head
        run: |
          python -c "from app.db.session import assert_schema_up_to_date; assert_schema_up_to_date(); print('schema-ok')"

  frontend-build:
    runs-on: ubuntu-latest
    needs: repo-guardrails
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Build frontend
        run: npm run build
